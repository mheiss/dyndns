name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup 
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Package
        run: |
          mkdir release
          cp -r build/quarkus-app release/
          cd release
          zip -r "../dyndns-app-${GITHUB_REF_NAME}.zip" .

      - name: Publish
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dyndns-app-${GITHUB_REF_NAME}.zip" \
            --title "Release ${GITHUB_REF_NAME}" \
            --notes "Automated release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
